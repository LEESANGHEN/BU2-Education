<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>교육 관리</title>
  <meta name="description" content="해외지사 · Agent · 고객사 담당자 설비교육 Level 0~3 관리">
  <meta name="format-detection" content="date=no,telephone=no,address=no">
  <script>
    (function(){var t=localStorage.getItem('edu_theme');if(t)document.documentElement.setAttribute('data-theme',t);})();
  </script>
  <link rel="stylesheet" href="style.css?v=20260917c">
</head>
<body>
  <div id="authOverlay" class="auth-overlay"></div>
  <div class="app" style="display:none">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="ttl" onclick="toggleAdminMode(event)" style="cursor:pointer;user-select:none" title="Ctrl+클릭: 관리자 모드 전환">🎓 교육 관리</span>
        <div class="conn-dot" id="connStatus" onclick="checkConn()" title="클릭하면 연결 상태 확인">
          <div class="conn-led" id="connLed"></div>
          <span id="connTxt">연결 확인</span>
        </div>
        <button class="sidebar-toggle" id="themeToggle" onclick="toggleTheme()" title="다크/라이트 모드 전환">🌙</button>
        <button class="btn sm" onclick="doLogout()" title="로그아웃">🚪 로그아웃</button>
      </div>
      <div class="tright" id="topbarRight">
        <div id="tools_apply" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <button class="btn" onclick="refreshApplications()">⟳ 새로고침</button>
          <button class="btn admin-only-btn" style="display:none" onclick="openApplyLinkInfo()">🔗 신청서 링크</button>
          <button class="btn admin-only-btn" style="display:none" onclick="openApplySheetsSettings()">⚙ 신청서 Sheets 설정</button>
        </div>
        <div id="tools_schedule" style="display:none;gap:6px;align-items:center;flex-wrap:wrap">
          <input type="text" class="gantt-search" placeholder="검색" oninput="schSearch(this.value)" autocomplete="off">
          <div id="schStatusChips" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"></div>
          <div class="btn-group">
            <button class="btn sm" id="schViewMonthBtn" onclick="schSetView('month')">월 단위</button>
            <button class="btn sm" id="schViewDayBtn" onclick="schSetView('day')">일 단위</button>
          </div>
          <div id="schDayNav" style="display:none;gap:4px;align-items:center">
            <button class="btn sm" onclick="schMoveMonth(-1)">◀</button>
            <span id="schDayNavLbl" style="font-size:12px;min-width:80px;text-align:center;display:inline-block"></span>
            <button class="btn sm" onclick="schMoveMonth(1)">▶</button>
            <button class="btn sm" onclick="schGotoToday()">오늘</button>
          </div>
          <button class="btn pri admin-only-btn" style="display:none" onclick="openVisitModal(null)">+ 교육 방문 등록</button>
        </div>
        <div id="tools_trainee" style="display:none;gap:6px;align-items:center;flex-wrap:wrap">
          <input type="text" class="gantt-search" placeholder="이름/소속 검색" oninput="trSearch(this.value)" autocomplete="off">
          <select id="trCountrySel" onchange="trFilterCountry(this.value)" style="width:auto"></select>
          <button class="btn pri admin-only-btn" style="display:none" onclick="openTraineeModal(null)">+ 대상자 등록</button>
        </div>
        <div id="tools_course" style="display:none"></div>
        <div id="tools_history" style="display:none"></div>
        <div id="tools_prelearn" style="display:none;gap:6px;align-items:center;flex-wrap:wrap">
          <button class="btn" onclick="refreshPrelearn()">⟳ 새로고침</button>
          <button class="btn admin-only-btn" style="display:none" onclick="openPrelearnLinkInfo()">🔗 학습 링크</button>
          <button class="btn admin-only-btn" style="display:none" onclick="openQuizAdmin()">📝 퀴즈 관리</button>
          <button class="btn pri" id="qaToolbarSaveBtn" style="display:none" onclick="saveQuizOverridesForSection()">💾 변경사항 저장</button>
          <button class="btn admin-only-btn" style="display:none" onclick="openPrelearnSheetsSettings()">⚙ 사전학습 Sheets 설정</button>
        </div>
        <button class="btn admin-only-btn" style="display:none" onclick="openSheetsSettings()">⚙ Sheets 설정</button>
        <div class="shortcut-wrap admin-only-btn" id="shortcutWrap" style="display:none">
          <button class="btn shortcut-trigger" onclick="toggleShortcut(event)">🔗 바로가기</button>
          <div class="shortcut-menu" id="shortcutMenu">
            <div class="shortcut-menu-header">BU2 바로가기</div>
            <a class="shortcut-item" href="https://portal.intekplus.com/" target="_blank" rel="noopener">
              <div class="shortcut-icon" style="background:#e0f2fe;">🗂️</div>
              <div class="si-info"><div class="si-name">INTEKPLUS Project Portal</div><div class="si-meta">portal.intekplus.com</div></div>
            </a>
            <a class="shortcut-item" href="https://do-intekplus.atlassian.net/wiki/spaces/lbi1bSfvdkX5/pages/1752367120" target="_blank" rel="noopener">
              <div class="shortcut-icon" style="background:#fef9c3;">📝</div>
              <div class="si-info"><div class="si-name">회의록</div><div class="si-meta">Confluence</div></div>
            </a>
            <a class="shortcut-item" href="https://bu-2-portal-git-main-2-23ca.vercel.app/" target="_blank" rel="noopener">
              <div class="shortcut-icon" style="background:#fce7f3;">🏠</div>
              <div class="si-info"><div class="si-name">BU2 Portal (전체 링크 모음)</div><div class="si-meta">bu-2-portal…vercel.app</div></div>
            </a>
          </div>
        </div>
      </div>
    </div>
    <div class="body-row">
      <div class="nav-sidebar" id="navSidebar">
        <button class="nav-item on" id="tab_home" onclick="switchTab('home')"><span class="ni-ico">🏠</span><span>홈</span></button>
        <button class="nav-item" id="tab_course" onclick="switchTab('course')"><span class="ni-ico">📚</span><span>교육 과정 관리</span></button>
        <button class="nav-item" id="tab_apply" onclick="switchTab('apply')"><span class="ni-ico">📥</span><span>신청 접수함</span></button>
        <button class="nav-item" id="tab_schedule" onclick="switchTab('schedule')"><span class="ni-ico">📅</span><span>교육 일정</span></button>
        <button class="nav-item" id="tab_trainee" onclick="switchTab('trainee')"><span class="ni-ico">👤</span><span>대상자별 이수 현황</span></button>
        <button class="nav-item" id="tab_history" onclick="switchTab('history')"><span class="ni-ico">📋</span><span>이력 관리</span></button>
        <button class="nav-item" id="tab_prelearn" onclick="switchTab('prelearn')"><span class="ni-ico">🧑‍🎓</span><span>사전학습 현황</span></button>
        <button class="nav-item" id="tab_stats" onclick="switchTab('stats')"><span class="ni-ico">📊</span><span>통계/리포트</span></button>
      </div>
      <div class="content-area">
        <div class="content" id="view_home">
          <div class="main"><div class="scroll-main" id="home_wrap"></div></div>
        </div>
        <div class="content" id="view_course" style="display:none">
          <div class="main"><div class="scroll-main" id="course_wrap"></div></div>
        </div>
        <div class="content" id="view_apply" style="display:none">
          <div class="main"><div class="scroll-main" id="apply_wrap"></div></div>
        </div>
        <div class="content" id="view_schedule" style="display:none">
          <div class="main"><div class="scroll-main" id="sch_wrap"></div></div>
        </div>
        <div class="content" id="view_trainee" style="display:none">
          <div class="main"><div class="scroll-main" id="tr_wrap"></div></div>
        </div>
        <div class="content" id="view_history" style="display:none">
          <div class="main"><div class="scroll-main" id="hist_wrap"></div></div>
        </div>
        <div class="content" id="view_prelearn" style="display:none">
          <div class="main"><div class="scroll-main" id="prelearn_wrap"></div></div>
        </div>
        <div class="content" id="view_stats" style="display:none">
          <div class="main"><div class="scroll-main" id="stats_wrap"></div></div>
        </div>
      </div>
    </div>
  </div>
  <div id="mc"></div>
  <div id="certOverlay" class="cert-overlay" style="display:none"></div>

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="firebase-config.js?v=1"></script>
  <script src="data.js?v=20260917a"></script>
  <script src="i18n.js?v=20260902e"></script>
  <script src="prelearn-equipment.js?v=20260828c"></script>
  <script src="prelearn-data-smtv.js?v=20260828b"></script>
  <script src="prelearn-data-nbga.js?v=20260828b"></script>
  <script src="app.js?v=20260917d"></script>
  <script src="applications.js?v=20260917a"></script>
  <script src="schedule.js?v=20260917a"></script>
  <script src="trainee.js?v=20260917b"></script>
  <script src="course-materials.js?v=13"></script>
  <script src="course.js?v=20260917b"></script>
  <script src="history.js?v=20260917a"></script>
  <script src="cert-i18n.js?v=20260903b"></script>
  <script src="certificate.js?v=20260903d"></script>
  <script src="prelearn-admin.js?v=20260902c"></script>
  <script src="stats.js?v=1"></script>
  <script src="auth.js?v=7"></script>
  <script>
    // 상태 필터 체크박스 + 국가 셀렉트를 데이터 로드 후 채움 (data.js 상수 사용)
    document.getElementById('schStatusChips').innerHTML = VISIT_STATUS.map(function(s){
      return '<label class="chkrow"><input type="checkbox" checked onchange="toggleSchStatus(\''+s.id+'\',this.checked)"><span style="color:'+s.color+'">●</span> '+s.label+'</label>';
    }).join('');
    document.getElementById('trCountrySel').innerHTML = '<option value="all">전체 국가</option>' + COUNTRIES.map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join('');
  </script>
</body>
</html>
